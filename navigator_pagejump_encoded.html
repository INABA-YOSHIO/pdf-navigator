<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Navigator (Page Jump / URL-encoded)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans JP',sans-serif}
    header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f5f5f5;border-bottom:1px solid #ddd;flex-wrap:wrap}
    #status{font-size:12px;color:#444;margin-left:auto}
    #viewer{display:flex;justify-content:center;padding:16px}
    canvas{box-shadow:0 2px 8px rgba(0,0,0,.1)}
    input[type=number]{width:80px}
    button{padding:6px 10px}
    #error{color:#b00020;padding:8px 12px}
  </style>
</head>
<body>
<header>
  <button id="prevBtn">◀ 前へ</button>
  <button id="nextBtn">次へ ▶</button>
  <label>ページ:
    <input id="pageInput" type="number" min="1" step="1">
    <span id="pageTotal">/ ?</span>
  </label>
  <button id="goBtn">移動</button>
  <div id="status">読み込み待ち…</div>
</header>
<div id="viewer"><canvas id="pdf"></canvas></div>
<div id="error"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(window.location.search);
const rawFile = params.get('file') || 'docs/sample.pdf';
// 文字化け・スペース・日本語対応のため URL をエンコード
const file = encodeURI(rawFile);
const pageParam = parseInt(params.get('page') || '1', 10);

let pdfDoc = null;
let currentPage = Number.isFinite(pageParam) && pageParam > 0 ? pageParam : 1;
let isRendering = false;

const statusEl = document.getElementById('status');
const pageInput = document.getElementById('pageInput');
const pageTotalEl = document.getElementById('pageTotal');
const canvas = document.getElementById('pdf');
const ctx = canvas.getContext('2d');
const errorEl = document.getElementById('error');

statusEl.textContent = `PDF: ${rawFile}`;

function showError(msg){
  errorEl.textContent = '読み込みエラー: ' + msg + ' / file=' + rawFile;
}

function renderPage(pageNum, scale = 1.25) {
  if (isRendering || !pdfDoc) return;
  isRendering = true;
  pdfDoc.getPage(pageNum).then(page => {
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const renderCtx = { canvasContext: ctx, viewport };
    statusEl.textContent = `PDF: ${rawFile} / 表示中: ${pageNum}ページ`;
    return page.render(renderCtx).promise;
  }).then(() => {
    isRendering = false;
  }).catch(err => {
    console.error(err); showError(err.message); isRendering = false;
  });
}

function setPage(pageNum) {
  if (!pdfDoc) return;
  if (pageNum < 1) pageNum = 1;
  if (pageNum > pdfDoc.numPages) pageNum = pdfDoc.numPages;
  currentPage = pageNum;
  pageInput.value = currentPage;
  renderPage(currentPage);
  const u = new URL(window.location);
  u.searchParams.set('page', String(currentPage));
  history.replaceState(null, '', u.toString());
}

document.getElementById('prevBtn').addEventListener('click', () => setPage(currentPage - 1));
document.getElementById('nextBtn').addEventListener('click', () => setPage(currentPage + 1));
document.getElementById('goBtn').addEventListener('click', () => {
  const n = parseInt(pageInput.value, 10);
  if (Number.isFinite(n)) setPage(n);
});

pdfjsLib.getDocument(file).promise.then(pdf => {
  pdfDoc = pdf;
  pageTotalEl.textContent = `/ ${pdfDoc.numPages}`;
  pageInput.min = 1;
  pageInput.max = pdfDoc.numPages;
  pageInput.value = currentPage;
  setPage(currentPage);
}).catch(err => { console.error(err); showError(err.message); });
</script>
</body>
</html>
